<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas del videojuego</title>
  <style>
    :root { --bg: #101426; --panel: #191f38; --text: #f4f7ff; --muted: #9ca8c7; --accent: #63e6be; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: var(--text); background: linear-gradient(135deg, #0b0e1b, var(--bg)); }
    .card { width: min(760px, 100%); padding: 28px; border: 1px solid #2c3558; border-radius: 18px; background: var(--panel); box-shadow: 0 18px 45px #0007; }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    p { margin: 0 0 25px; color: var(--muted); }
    .chart { height: 330px; display: flex; align-items: end; gap: clamp(10px, 3vw, 24px); padding: 20px 12px 36px; border-bottom: 2px solid #485273; background: repeating-linear-gradient(to top, transparent 0 59px, #ffffff0b 60px); }
    .bar-wrap { height: 100%; flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 10px; }
    .bar { width: min(62px, 80%); height: calc(var(--value) * 1%); min-height: 5px; border-radius: 10px 10px 2px 2px; background: linear-gradient(to top, #4776ff, var(--accent)); transition: height .7s ease, filter .2s; position: relative; }
    .bar:hover { filter: brightness(1.25); }
    .bar::after { content: attr(data-score); position: absolute; top: -25px; left: 50%; transform: translateX(-50%); color: var(--text); font-size: .8rem; font-weight: bold; }
    .label { color: var(--muted); font-size: .8rem; }
    .legend { display: flex; justify-content: space-between; margin-top: 18px; color: var(--muted); font-size: .85rem; }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; background: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Rendimiento por nivel</h1>
    <p>Puntuación promedio de jugadores en una partida</p>
    <section class="chart" aria-label="Gráfica de barras de puntuación por nivel">
      <div class="bar-wrap"><div class="bar" style="--value: 48" data-score="480"></div><span class="label">Nivel 1</span></div>
      <div class="bar-wrap"><div class="bar" style="--value: 67" data-score="670"></div><span class="label">Nivel 2</span></div>
      <div class="bar-wrap"><div class="bar" style="--value: 54" data-score="540"></div><span class="label">Nivel 3</span></div>
      <div class="bar-wrap"><div class="bar" style="--value: 82" data-score="820"></div><span class="label">Nivel 4</span></div>
      <div class="bar-wrap"><div class="bar" style="--value: 74" data-score="740"></div><span class="label">Nivel 5</span></div>
      <div class="bar-wrap"><div class="bar" style="--value: 93" data-score="930"></div><span class="label">Nivel 6</span></div>
    </section>
    <div class="legend"><span><i class="dot"></i>Puntuación promedio</span><span>Máximo: 1000 puntos</span></div>
  </main>
</body>
</html>
