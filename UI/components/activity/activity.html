<section class="bottom-grid">
  <section class="panel event-list-panel">
    <div class="panel-heading">
      <div>
        <p class="section-kicker">Consulta rápida</p>
        <h2>Eventos activos</h2>
      </div>
      <span id="list-count" class="count-label">0 registros</span>
    </div>
    <div id="event-list" class="event-list">
      <p class="muted">No hay eventos activos.</p>
    </div>
  </section>
  <section class="panel activity-panel">
    <div class="panel-heading">
      <div>
        <p class="section-kicker">Trazabilidad</p>
        <h2>Actividad reciente</h2>
      </div>
      <button
        id="clear-activity"
        class="icon-button"
        type="button"
        title="Limpiar historial"
        aria-label="Limpiar historial"
      >
        ×
      </button>
      <button
        id="undo-button"
        class="icon-button"
        type="button"
        title="Deshacer última acción"
        aria-label="Deshacer última acción"
      >
        ↶
      </button>
    </div>
    <div id="activity-list" class="activity-list">
      <p class="muted">Todavía no hay acciones.</p>
    </div>
  </section>
</section>
